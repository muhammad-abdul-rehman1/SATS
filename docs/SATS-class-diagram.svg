<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34515e"/>
    </marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 2 6 L 6 2 L 10 6 L 6 10 z" fill="#ffffff" stroke="#34515e" stroke-width="1.5"/>
    </marker>
    <style>
      .bg{fill:#f7fafc}
      .title{font:700 38px Arial,Helvetica,sans-serif;fill:#102a43}
      .subtitle{font:18px Arial,Helvetica,sans-serif;fill:#52616b}
      .box{fill:#ffffff;stroke:#34515e;stroke-width:2;rx:8}
      .entity{fill:#eef7ff;stroke:#1f6f9f}
      .control{fill:#fff7e6;stroke:#b7791f}
      .boundary{fill:#f0fff4;stroke:#2f855a}
      .support{fill:#f8f0ff;stroke:#6b46c1}
      .db{fill:#edf2f7;stroke:#4a5568}
      .head{font:700 20px Arial,Helvetica,sans-serif;fill:#102a43}
      .stereo{font:italic 14px Arial,Helvetica,sans-serif;fill:#52616b}
      .text{font:15px Consolas,Menlo,monospace;fill:#243b53}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#52616b}
      .line{stroke:#34515e;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .agg{stroke:#34515e;stroke-width:2;fill:none;marker-start:url(#diamond);marker-end:url(#arrow)}
      .dash{stroke:#607d8b;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      .label{font:13px Arial,Helvetica,sans-serif;fill:#1f2933}
      .section{font:700 18px Arial,Helvetica,sans-serif;fill:#334e68}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2200" height="1500"/>
  <text class="title" x="80" y="70">SATS Smart Asset Tracking System - Connected Class Diagram</text>
  <text class="subtitle" x="80" y="102">Frontend boundary classes, backend route/controllers, middleware, services, and MongoDB domain entities</text>

  <text class="section" x="90" y="155">Client / UI Layer</text>
  <text class="section" x="585" y="155">API Service Layer</text>
  <text class="section" x="1055" y="155">Backend Route &amp; Middleware Layer</text>
  <text class="section" x="1570" y="155">Domain Model / Database Layer</text>

  <!-- Client layer -->
  <rect class="box boundary" x="80" y="180" width="360" height="160"/>
  <text class="head" x="260" y="212" text-anchor="middle">MobileApp</text>
  <text class="stereo" x="260" y="235" text-anchor="middle">&lt;&lt;React Native UI&gt;&gt;</text>
  <line x1="80" y1="248" x2="440" y2="248" stroke="#2f855a" stroke-width="1.5"/>
  <text class="text" x="100" y="275">+ login(), register()</text>
  <text class="text" x="100" y="298">+ scanQRCode()</text>
  <text class="text" x="100" y="321">+ manageAssets(), manageRooms()</text>

  <rect class="box boundary" x="80" y="385" width="360" height="165"/>
  <text class="head" x="260" y="418" text-anchor="middle">WebDashboard</text>
  <text class="stereo" x="260" y="441" text-anchor="middle">&lt;&lt;Next.js UI&gt;&gt;</text>
  <line x1="80" y1="454" x2="440" y2="454" stroke="#2f855a" stroke-width="1.5"/>
  <text class="text" x="100" y="481">+ viewDashboard()</text>
  <text class="text" x="100" y="504">+ manageUsers()</text>
  <text class="text" x="100" y="527">+ viewReports(), viewScanHistory()</text>

  <rect class="box boundary" x="80" y="595" width="360" height="185"/>
  <text class="head" x="260" y="628" text-anchor="middle">AuthContext</text>
  <line x1="80" y1="642" x2="440" y2="642" stroke="#2f855a" stroke-width="1.5"/>
  <text class="text" x="100" y="668">user: User</text>
  <text class="text" x="100" y="691">isAuthenticated: Boolean</text>
  <line x1="80" y1="705" x2="440" y2="705" stroke="#2f855a" stroke-width="1.5"/>
  <text class="text" x="100" y="731">+ login(), register()</text>
  <text class="text" x="100" y="754">+ logout(), updateUser()</text>

  <!-- API service layer -->
  <rect class="box control" x="555" y="210" width="345" height="150"/>
  <text class="head" x="727" y="243" text-anchor="middle">ApiClient</text>
  <line x1="555" y1="258" x2="900" y2="258" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="575" y="284">baseURL: String</text>
  <text class="text" x="575" y="307">timeout: Number</text>
  <line x1="555" y1="321" x2="900" y2="321" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="575" y="347">+ attachBearerToken()</text>

  <rect class="box control" x="535" y="410" width="180" height="125"/>
  <text class="head" x="625" y="442" text-anchor="middle">AuthAPI</text>
  <line x1="535" y1="456" x2="715" y2="456" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="550" y="482">+ login()</text>
  <text class="text" x="550" y="505">+ register()</text>
  <text class="text" x="550" y="528">+ getProfile()</text>

  <rect class="box control" x="740" y="410" width="205" height="150"/>
  <text class="head" x="842" y="442" text-anchor="middle">AssetsAPI</text>
  <line x1="740" y1="456" x2="945" y2="456" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="755" y="482">+ getAll()</text>
  <text class="text" x="755" y="505">+ create(), update()</text>
  <text class="text" x="755" y="528">+ generateQRCode()</text>
  <text class="text" x="755" y="551">+ downloadQrPdf()</text>

  <rect class="box control" x="535" y="590" width="190" height="145"/>
  <text class="head" x="630" y="622" text-anchor="middle">RoomsAPI</text>
  <line x1="535" y1="636" x2="725" y2="636" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="550" y="662">+ getAll()</text>
  <text class="text" x="550" y="685">+ getAssets()</text>
  <text class="text" x="550" y="708">+ scan()</text>

  <rect class="box control" x="750" y="590" width="195" height="145"/>
  <text class="head" x="847" y="622" text-anchor="middle">QRAPI</text>
  <line x1="750" y1="636" x2="945" y2="636" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="765" y="662">+ resolve()</text>
  <text class="text" x="765" y="685">+ getScanHistory()</text>
  <text class="text" x="765" y="708">+ getScanStats()</text>

  <rect class="box control" x="635" y="780" width="205" height="145"/>
  <text class="head" x="737" y="812" text-anchor="middle">UsersAPI</text>
  <line x1="635" y1="826" x2="840" y2="826" stroke="#b7791f" stroke-width="1.5"/>
  <text class="text" x="650" y="852">+ getAll()</text>
  <text class="text" x="650" y="875">+ create(), update()</text>
  <text class="text" x="650" y="898">+ updateRole()</text>

  <!-- Backend -->
  <rect class="box support" x="1040" y="205" width="305" height="135"/>
  <text class="head" x="1192" y="238" text-anchor="middle">AuthMiddleware</text>
  <line x1="1040" y1="252" x2="1345" y2="252" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1060" y="279">+ isAuthenticated()</text>
  <text class="text" x="1060" y="302">+ isSuperAdmin()</text>

  <rect class="box support" x="1010" y="390" width="250" height="140"/>
  <text class="head" x="1135" y="422" text-anchor="middle">AuthRoutes</text>
  <line x1="1010" y1="436" x2="1260" y2="436" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1030" y="462">+ POST /register</text>
  <text class="text" x="1030" y="485">+ POST /login</text>
  <text class="text" x="1030" y="508">+ GET /profile</text>

  <rect class="box support" x="1295" y="390" width="275" height="165"/>
  <text class="head" x="1432" y="422" text-anchor="middle">AssetRoutes</text>
  <line x1="1295" y1="436" x2="1570" y2="436" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1315" y="462">+ CRUD /assets</text>
  <text class="text" x="1315" y="485">+ GET /:id/qr</text>
  <text class="text" x="1315" y="508">+ GET /all/qr-pdf</text>
  <text class="text" x="1315" y="531">+ POST /:id/scan</text>

  <rect class="box support" x="1010" y="590" width="260" height="165"/>
  <text class="head" x="1140" y="622" text-anchor="middle">RoomRoutes</text>
  <line x1="1010" y1="636" x2="1270" y2="636" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1030" y="662">+ CRUD /rooms</text>
  <text class="text" x="1030" y="685">+ GET /:id/assets</text>
  <text class="text" x="1030" y="708">+ GET /:id/qr-code</text>
  <text class="text" x="1030" y="731">+ POST /:id/scan</text>

  <rect class="box support" x="1305" y="610" width="285" height="145"/>
  <text class="head" x="1447" y="642" text-anchor="middle">ResolveRoutes</text>
  <line x1="1305" y1="656" x2="1590" y2="656" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1325" y="682">+ POST /resolve</text>
  <text class="text" x="1325" y="705">+ GET /scan-history</text>
  <text class="text" x="1325" y="728">+ GET /scan-stats</text>

  <rect class="box support" x="1105" y="805" width="270" height="145"/>
  <text class="head" x="1240" y="837" text-anchor="middle">UserRoutes</text>
  <line x1="1105" y1="851" x2="1375" y2="851" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1125" y="877">+ CRUD /users</text>
  <text class="text" x="1125" y="900">+ PATCH /:id/role</text>
  <text class="text" x="1125" y="923">+ SUPER_ADMIN checks</text>

  <rect class="box support" x="1190" y="1000" width="315" height="145"/>
  <text class="head" x="1347" y="1032" text-anchor="middle">QRCodeService</text>
  <line x1="1190" y1="1046" x2="1505" y2="1046" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="text" x="1210" y="1072">+ generateQR()</text>
  <text class="text" x="1210" y="1095">+ generateQRCodeForAsset()</text>
  <text class="text" x="1210" y="1118">+ generateQRCodeForRoom()</text>

  <!-- Domain layer -->
  <rect class="box entity" x="1650" y="190" width="390" height="175"/>
  <text class="head" x="1845" y="223" text-anchor="middle">User</text>
  <line x1="1650" y1="237" x2="2040" y2="237" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="text" x="1670" y="263">_id: ObjectId</text>
  <text class="text" x="1670" y="286">email: String, password: String</text>
  <text class="text" x="1670" y="309">name: String</text>
  <text class="text" x="1670" y="332">role: USER | SUPER_ADMIN</text>
  <text class="text" x="1670" y="355">createdAt, updatedAt: Date</text>

  <rect class="box entity" x="1650" y="410" width="390" height="275"/>
  <text class="head" x="1845" y="443" text-anchor="middle">Asset</text>
  <line x1="1650" y1="457" x2="2040" y2="457" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="text" x="1670" y="483">_id: ObjectId</text>
  <text class="text" x="1670" y="506">assetTag: String</text>
  <text class="text" x="1670" y="529">name, description: String</text>
  <text class="text" x="1670" y="552">assetType: EQUIPMENT | FURNITURE | ...</text>
  <text class="text" x="1670" y="575">status: ACTIVE | INACTIVE | ...</text>
  <text class="text" x="1670" y="598">ownerId: ObjectId -&gt; User</text>
  <text class="text" x="1670" y="621">roomId: ObjectId -&gt; Room</text>
  <text class="text" x="1670" y="644">qrCode, customFields</text>
  <text class="text" x="1670" y="667">lastScanned, scanCount</text>

  <rect class="box entity" x="1650" y="730" width="390" height="270"/>
  <text class="head" x="1845" y="763" text-anchor="middle">Room</text>
  <line x1="1650" y1="777" x2="2040" y2="777" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="text" x="1670" y="803">_id: ObjectId</text>
  <text class="text" x="1670" y="826">code: String</text>
  <text class="text" x="1670" y="849">name, building, floor</text>
  <text class="text" x="1670" y="872">latitude, longitude: Number</text>
  <text class="text" x="1670" y="895">roomType: OFFICE | LAB | ...</text>
  <text class="text" x="1670" y="918">capacity: Number</text>
  <text class="text" x="1670" y="941">qrCode, description</text>
  <text class="text" x="1670" y="964">lastScanned, scanCount</text>

  <rect class="box entity" x="1650" y="1045" width="390" height="270"/>
  <text class="head" x="1845" y="1078" text-anchor="middle">ScanLog</text>
  <line x1="1650" y1="1092" x2="2040" y2="1092" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="text" x="1670" y="1118">_id: ObjectId</text>
  <text class="text" x="1670" y="1141">qrData: String</text>
  <text class="text" x="1670" y="1164">qrType: ASSET | ROOM | LOCATION</text>
  <text class="text" x="1670" y="1187">scannedBy: ObjectId -&gt; User</text>
  <text class="text" x="1670" y="1210">scannedAt: Date</text>
  <text class="text" x="1670" y="1233">action: VIEW | UPDATE | MOVE | ...</text>
  <text class="text" x="1670" y="1256">metadata, userId, entityId</text>
  <text class="text" x="1670" y="1279">timestamp: Date</text>

  <rect class="box entity" x="2060" y="480" width="120" height="145"/>
  <text class="head" x="2120" y="512" text-anchor="middle">QRStyle</text>
  <line x1="2060" y1="526" x2="2180" y2="526" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="small" x="2072" y="552">type</text>
  <text class="small" x="2072" y="575">color</text>
  <text class="small" x="2072" y="598">background</text>
  <text class="small" x="2072" y="621">size</text>

  <rect class="box entity" x="2060" y="1065" width="120" height="120"/>
  <text class="head" x="2120" y="1096" text-anchor="middle">Location</text>
  <line x1="2060" y1="1110" x2="2180" y2="1110" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="small" x="2072" y="1136">latitude</text>
  <text class="small" x="2072" y="1159">longitude</text>
  <text class="small" x="2072" y="1182">accuracy</text>

  <rect class="box entity" x="2060" y="1215" width="120" height="115"/>
  <text class="head" x="2120" y="1246" text-anchor="middle">DeviceInfo</text>
  <line x1="2060" y1="1260" x2="2180" y2="1260" stroke="#1f6f9f" stroke-width="1.5"/>
  <text class="small" x="2072" y="1286">platform</text>
  <text class="small" x="2072" y="1309">version</text>

  <rect class="box db" x="1700" y="1365" width="300" height="85"/>
  <text class="head" x="1850" y="1398" text-anchor="middle">MongoDB</text>
  <text class="stereo" x="1850" y="1423" text-anchor="middle">&lt;&lt;users, assets, rooms, scanlogs&gt;&gt;</text>

  <!-- Connections: client to services -->
  <path class="line" d="M440 250 C485 250 510 250 555 250"/>
  <text class="label" x="455" y="240">HTTP setup</text>
  <path class="line" d="M440 445 C475 430 500 420 535 420"/>
  <path class="line" d="M440 475 C560 455 620 455 740 455"/>
  <path class="line" d="M440 505 C475 565 500 620 535 650"/>
  <path class="line" d="M440 520 C570 585 625 625 750 650"/>
  <path class="line" d="M440 690 C480 610 515 510 535 475"/>
  <text class="label" x="465" y="680">authenticates</text>
  <path class="line" d="M260 340 L260 385"/>
  <text class="label" x="274" y="365">same services</text>

  <!-- Services to ApiClient -->
  <path class="line" d="M625 410 C650 380 680 365 705 360"/>
  <path class="line" d="M842 410 C825 380 795 365 760 360"/>
  <path class="line" d="M630 590 C655 505 675 420 705 360"/>
  <path class="line" d="M847 590 C820 505 795 425 760 360"/>
  <path class="line" d="M737 780 C735 610 735 460 735 360"/>

  <!-- ApiClient to routes -->
  <path class="line" d="M900 270 C945 310 970 365 1010 425"/>
  <path class="line" d="M900 290 C1035 330 1160 390 1295 460"/>
  <path class="line" d="M900 315 C955 420 990 535 1010 660"/>
  <path class="line" d="M900 330 C1065 450 1200 565 1305 680"/>
  <path class="line" d="M900 345 C980 555 1040 725 1105 875"/>

  <!-- Middleware to routes and user -->
  <path class="dash" d="M1192 340 L1135 390"/>
  <path class="dash" d="M1285 340 L1390 390"/>
  <path class="dash" d="M1160 340 L1140 590"/>
  <path class="dash" d="M1250 340 L1447 610"/>
  <path class="dash" d="M1205 340 L1240 805"/>
  <path class="line" d="M1345 255 C1475 245 1540 240 1650 260"/>
  <text class="label" x="1450" y="235">loads req.user</text>

  <!-- Routes to domain -->
  <path class="line" d="M1260 460 C1390 390 1510 295 1650 275"/>
  <text class="label" x="1420" y="372">creates/login</text>
  <path class="line" d="M1375 875 C1505 740 1585 415 1650 300"/>
  <text class="label" x="1515" y="705">admin manages</text>
  <path class="line" d="M1570 480 L1650 515"/>
  <path class="line" d="M1570 505 C1610 565 1618 775 1650 835"/>
  <path class="line" d="M1570 535 C1610 705 1618 1090 1650 1160"/>
  <path class="line" d="M1270 665 C1415 640 1510 575 1650 560"/>
  <path class="line" d="M1270 700 C1410 745 1510 820 1650 850"/>
  <path class="line" d="M1270 735 C1425 850 1530 1110 1650 1185"/>
  <path class="line" d="M1590 675 C1620 630 1635 585 1650 540"/>
  <path class="line" d="M1590 700 C1620 755 1635 810 1650 865"/>
  <path class="line" d="M1590 725 C1625 890 1635 1050 1650 1175"/>
  <path class="line" d="M1435 555 C1440 740 1405 955 1505 1055"/>
  <path class="line" d="M1230 755 C1225 850 1245 960 1300 1000"/>

  <!-- Domain relationships -->
  <path class="line" d="M1845 410 L1845 365"/>
  <text class="label" x="1858" y="392">ownerId 0..1</text>
  <path class="line" d="M1845 685 L1845 730"/>
  <text class="label" x="1858" y="715">roomId 0..1</text>
  <path class="line" d="M1740 1045 C1705 895 1708 475 1765 365"/>
  <text class="label" x="1660" y="1018">scannedBy 1</text>
  <path class="dash" d="M1790 1045 C1770 900 1770 770 1795 685"/>
  <text class="label" x="1710" y="790">metadata.entityId</text>
  <path class="dash" d="M1870 1045 C1915 970 1925 900 1930 1000"/>
  <text class="label" x="1905" y="1028">metadata.entityId</text>
  <path class="agg" d="M2040 545 L2060 545"/>
  <path class="agg" d="M2040 835 C2080 785 2100 690 2120 625"/>
  <path class="agg" d="M2040 1145 L2060 1135"/>
  <path class="agg" d="M2040 1245 L2060 1260"/>

  <!-- Persistence -->
  <path class="line" d="M1845 365 C1820 715 1815 1095 1838 1365"/>
  <path class="line" d="M1900 685 C1885 920 1875 1180 1865 1365"/>
  <path class="line" d="M1850 1000 L1850 1365"/>
  <path class="line" d="M1845 1315 L1845 1365"/>

  <!-- Legend -->
  <rect class="box" x="80" y="1290" width="760" height="130"/>
  <text class="head" x="110" y="1325">Legend</text>
  <rect class="boundary" x="110" y="1345" width="24" height="18"/>
  <text class="small" x="145" y="1360">Boundary/UI classes</text>
  <rect class="control" x="310" y="1345" width="24" height="18"/>
  <text class="small" x="345" y="1360">API service/control classes</text>
  <rect class="support" x="560" y="1345" width="24" height="18"/>
  <text class="small" x="595" y="1360">Backend route/middleware/service</text>
  <rect class="entity" x="110" y="1380" width="24" height="18"/>
  <text class="small" x="145" y="1395">Mongoose domain entity</text>
  <line x1="310" y1="1389" x2="370" y2="1389" class="line"/>
  <text class="small" x="385" y="1395">uses / references</text>
  <line x1="560" y1="1389" x2="620" y2="1389" class="dash"/>
  <text class="small" x="635" y="1395">derived / metadata relation</text>
</svg>
